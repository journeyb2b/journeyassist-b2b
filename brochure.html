<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2B Tour Brochure | Journey Assist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900 pb-12">

  <!-- PRINT / ACTION BAR -->
  <div class="no-print bg-slate-900 text-white py-3 px-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <a href="index.html" class="text-xs font-bold text-slate-300 hover:text-white flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
      </a>
      <div class="flex items-center gap-3">
        <button onclick="window.print()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-extrabold transition flex items-center gap-2">
          <i class="fa-solid fa-print"></i> Print / Save PDF
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN BROCHURE CARD -->
  <main class="max-w-4xl mx-auto mt-6 bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden" id="brochureContainer">
    <div class="p-12 text-center text-slate-400 font-bold text-sm">
      <i class="fa-solid fa-spinner fa-spin text-2xl text-blue-600 mb-3"></i><br>
      Loading dynamic brochure details...
    </div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCd7Xe2Sns5ZdIme5ZHXRIv3gl4O5abhKWivfBFACmUOMSH1BmSa3y1oAkUFKByS0QkQ/exec";

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const pkgId = urlParams.get('id');

      if (!pkgId) {
        document.getElementById('brochureContainer').innerHTML = `
          <div class="p-12 text-center text-rose-500 font-bold text-sm">
            No package ID provided in the link. Please select a package from dashboard.
          </div>
        `;
        return;
      }

      fetchPackageData(pkgId);
    };

    async function fetchPackageData(id) {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getPackage&id=${encodeURIComponent(id)}`);
        const data = await response.json();

        if (data.success && data.package) {
          renderBrochure(data.package);
        } else {
          document.getElementById('brochureContainer').innerHTML = `
            <div class="p-12 text-center text-rose-500 font-bold text-sm">
              Package details not found for ID: ${id}
            </div>
          `;
        }
      } catch (err) {
        console.error(err);
        document.getElementById('brochureContainer').innerHTML = `
          <div class="p-12 text-center text-rose-500 font-bold text-sm">
            Error loading brochure data. Please check your network connection.
          </div>
        `;
      }
    }

    function renderBrochure(p) {
      let rateGridHtml = '';
      try {
        const grid = typeof p.ratesGrid === 'string' ? JSON.parse(p.ratesGrid) : p.ratesGrid;
        if (Array.isArray(grid) && grid.length > 0) {
          rateGridHtml = `
            <div class="overflow-x-auto mt-4">
              <table class="w-full text-left text-xs border-collapse border border-slate-200">
                <thead>
                  <tr class="bg-blue-900 text-white font-extrabold uppercase">
                    <th class="p-3 border border-slate-300">Category / Option</th>
                    <th class="p-3 border border-slate-300">B2B Net Rate</th>
                  </tr>
                </thead>
                <tbody>
                  ${grid.map(g => `
                    <tr class="hover:bg-slate-50">
                      <td class="p-3 border border-slate-200 font-bold text-slate-800">${g.category || g.hotel || 'Standard Option'}</td>
                      <td class="p-3 border border-slate-200 font-black text-blue-700">${g.price || g.rate || p.b2bPrice || '-'}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `;
        } else {
          rateGridHtml = `<p class="text-xs font-semibold text-slate-600 bg-slate-50 p-4 rounded-xl border border-slate-200 mt-2">${p.b2bPrice || 'Rates available on request'}</p>`;
        }
      } catch (e) {
        rateGridHtml = `<p class="text-xs font-semibold text-slate-600 bg-slate-50 p-4 rounded-xl border border-slate-200 mt-2">${p.b2bPrice || 'Rates available on request'}</p>`;
      }

      // Itinerary lines formatting
      const itineraryFormatted = p.itinerary ? p.itinerary.replace(/\n/g, '<br>') : 'Custom day-wise itinerary will be provided upon booking.';

      document.getElementById('brochureContainer').innerHTML = `
        <!-- BROCHURE HEADER -->
        <div class="bg-slate-900 text-white p-8 sm:p-10 flex flex-col sm:flex-row sm:items-center justify-between gap-6 border-b-4 border-amber-400">
          <div>
            <span class="px-3 py-1 rounded-full bg-blue-600/30 border border-blue-400/40 text-amber-300 text-[10px] font-black uppercase tracking-wider">${p.destination || 'Destination Tour'} (${p.region || 'Domestic'})</span>
            <h1 class="text-2xl sm:text-4xl font-black mt-2 tracking-tight">${p.title || 'Holiday Package'}</h1>
            <p class="text-xs font-bold text-slate-300 mt-1"><i class="fa-regular fa-clock text-amber-400 mr-1"></i> Duration: ${p.duration || 'Flexible'}</p>
          </div>
          <div class="text-left sm:text-right bg-slate-800/80 p-4 rounded-2xl border border-slate-700">
            <p class="text-[10px] font-extrabold uppercase text-slate-400 tracking-wider">Starting Net Rate</p>
            <p class="text-2xl sm:text-3xl font-black text-amber-400">${p.b2bPrice || 'On Request'}</p>
            <p class="text-[9px] text-slate-400 uppercase font-extrabold mt-0.5">B2B Agent Price</p>
          </div>
        </div>

        <div class="p-8 sm:p-10 space-y-8">
          
          <!-- VALIDITY & INCLUSIONS -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-1">
              <p class="text-xs font-extrabold text-slate-500 uppercase tracking-wider"><i class="fa-solid fa-calendar-check text-blue-600 mr-1.5"></i> Travel Validity</p>
              <p class="text-sm font-black text-slate-800">${p.travelDates || 'Valid for current season'}</p>
            </div>
            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-1">
              <p class="text-xs font-extrabold text-slate-500 uppercase tracking-wider"><i class="fa-solid fa-square-check text-emerald-600 mr-1.5"></i> Key Inclusions</p>
              <p class="text-sm font-extrabold text-slate-800">${p.inclusions || 'Hotel accommodation, Transfers, Sightseeing, Daily Breakfast'}</p>
            </div>
          </div>

          <!-- RATE GRID -->
          <div>
            <h3 class="text-sm font-black uppercase tracking-wider text-slate-900 flex items-center gap-2">
              <i class="fa-solid fa-table-cells text-blue-600"></i> Rate Options & Categories
            </h3>
            ${rateGridHtml}
          </div>

          <!-- DAY WISE ITINERARY -->
          <div>
            <h3 class="text-sm font-black uppercase tracking-wider text-slate-900 mb-3 flex items-center gap-2">
              <i class="fa-solid fa-route text-blue-600"></i> Tour Itinerary Details
            </h3>
            <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200 text-xs font-medium text-slate-700 leading-relaxed">
              ${itineraryFormatted}
            </div>
          </div>

          <!-- FOOTER / HELPLINE -->
          <div class="pt-6 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between text-xs font-bold text-slate-500 gap-4">
            <p><i class="fa-solid fa-building text-blue-600 mr-1"></i> Journey Assist B2B Operations</p>
            <p><i class="fa-solid fa-phone text-blue-600 mr-1"></i> Helpline: +91 9919382999</p>
          </div>

        </div>
      `;
    }
  </script>
</body>
</html>
