<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B2B Tour Brochure | Journey Assist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900 pb-12">

  <!-- PRINT / ACTION BAR -->
  <div class="no-print bg-slate-900 text-white py-3 px-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <a href="index.html" class="text-xs font-bold text-slate-300 hover:text-white flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
      </a>
      <div class="flex items-center gap-3">
        <button onclick="window.print()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-extrabold transition flex items-center gap-2">
          <i class="fa-solid fa-print"></i> Print / Save PDF
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN BROCHURE CARD -->
  <main class="max-w-4xl mx-auto mt-6 bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden" id="brochureContainer">
    <div class="p-12 text-center text-slate-400 font-bold text-sm">
      <i class="fa-solid fa-spinner fa-spin text-2xl text-blue-600 mb-3"></i><br>
      Loading dynamic brochure details...
    </div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCd7Xe2Sns5ZdIme5ZHXRIv3gl4O5abhKWivfBFACmUOMSH1BmSa3y1oAkUFKByS0QkQ/exec";

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const pkgId = urlParams.get('id');

      if (!pkgId) {
        document.getElementById('brochureContainer').innerHTML = `
          <div class="p-12 text-center text-rose-500 font-bold text-sm">
            No package ID provided in the link. Please select a package from dashboard.
          </div>
        `;
        return;
      }

      fetchPackageData(pkgId);
    };

    async function fetchPackageData(id) {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getPackage&id=${encodeURIComponent(id)}`);
        const data = await response.json();

        if (data.success && data.package) {
          renderBrochure(data.package);
        } else {
          document.getElementById('brochureContainer').innerHTML = `
            <div class="p-12 text-center text-rose-500 font-bold text-sm">
              Package details not found for ID: ${id}
            </div>
          `;
        }
      } catch (err) {
        console.error(err);
        document.getElementById('brochureContainer').innerHTML = `
          <div class="p-12 text-center text-rose-500 font-bold text-sm">
            Error loading brochure data. Please check your network connection.
          </div>
        `;
      }
    }

    function formatAsList(text, iconClass, itemColorClass) {
      if (!text) return '<p class="text-xs text-slate-400 font-medium">N/A</p>';
      const lines = text.split('\n').filter(line => line.trim() !== '');
      if (lines.length === 0) return '<p class="text-xs text-slate-400 font-medium">N/A</p>';
      
      return `
        <ul class="space-y-1.5 text-xs font-semibold ${itemColorClass}">
          ${lines.map(l => `
            <li class="flex items-start gap-2">
              <i class="${iconClass} mt-0.5 text-[11px] shrink-0"></i>
              <span>${l.trim()}</span>
            </li>
          `).join('')}
        </ul>
      `;
    }

    function renderBrochure(p) {
      let rateGridsHtml = '';
      try {
        const gridBlocks = typeof p.ratesGrid === 'string' ? JSON.parse(p.ratesGrid) : p.ratesGrid;
        
        if (Array.isArray(gridBlocks) && gridBlocks.length > 0) {
          gridBlocks.forEach(blk => {
            const h = blk.headers || {
              h1: "2 Pax CP", h2: "2 Pax MAP", 
              h3: "4 Pax CP", h4: "4 Pax MAP",
              h5: "Ex. Bed CP", h6: "Ex. Bed MAP", 
              h7: "Child CP", h8: "Child MAP"
            };

            let cardsHtml = '';
            if (blk.rows && blk.rows.length > 0) {
              blk.rows.forEach(r => {
                cardsHtml += `
                  <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
                      <span class="font-black text-xs text-slate-900">${r.plan || '-'}</span>
                      <span class="px-2.5 py-0.5 bg-blue-100 text-blue-800 rounded-full text-[10px] font-extrabold uppercase">${r.cat || 'Standard'}</span>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-[11px]">
                      <div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="block text-[9px] text-slate-500 uppercase font-bold">${h.h1}</span><strong class="text-amber-600">${r.v1 || '-'}</strong></div>
                      <div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="block text-[9px] text-slate-500 uppercase font-bold">${h.h2}</span><strong class="text-amber-600">${r.v2 || '-'}</strong></div>
                      <div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="block text-[9px] text-slate-500 uppercase font-bold">${h.h3}</span><strong class="text-amber-600">${r.v3 || '-'}</strong></div>
                      <div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="block text-[9px] text-slate-500 uppercase font-bold">${h.h4}</span><strong class="text-amber-600">${r.v4 || '-'}</strong></div>
                      <div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="block text-[9px] text-slate-500 uppercase font-bold">${h.h5}</span><span>${r.v5 || '-'}</span></div>
                      <div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="block text-[9px] text-slate-500 uppercase font-bold">${h.h6}</span><span>${r.v6 || '-'}</span></div>
                      <div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="block text-[9px] text-slate-500 uppercase font-bold">${h.h7}</span><span>${r.v7 || '-'}</span></div>
                      <div class="bg-slate-50 p-2 rounded-xl border border-slate-100"><span class="block text-[9px] text-slate-500 uppercase font-bold">${h.h8}</span><span>${r.v8 || '-'}</span></div>
                    </div>
                  </div>
                `;
              });
            } else {
              cardsHtml = `<p class="p-4 text-center text-slate-500 font-bold text-xs">No rate rows added in this block.</p>`;
            }

            rateGridsHtml += `
              <div class="mb-6 bg-slate-50 border border-slate-200 rounded-2xl p-4 sm:p-6 space-y-4">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1 border-b border-slate-200 pb-3">
                  <h4 class="text-sm font-black text-blue-900 uppercase flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days text-blue-600"></i> ${blk.title || 'Package Duration'}
                  </h4>
                  <p class="text-xs font-bold text-slate-600">${blk.subtitle || ''}</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                  ${cardsHtml}
                </div>
              </div>
            `;
          });
        } else {
          rateGridsHtml = `<p class="text-xs font-semibold text-slate-600 bg-slate-50 p-4 rounded-xl border border-slate-200 mt-2">${p.b2bPrice || 'Rates available on request'}</p>`;
        }
      } catch (e) {
        rateGridsHtml = `<p class="text-xs font-semibold text-slate-600 bg-slate-50 p-4 rounded-xl border border-slate-200 mt-2">${p.b2bPrice || 'Rates available on request'}</p>`;
      }

      let pdfLinksHtml = '';
      try {
        const pdfLinks = typeof p.itineraryLinks === 'string' ? JSON.parse(p.itineraryLinks) : p.itineraryLinks;
        if (Array.isArray(pdfLinks) && pdfLinks.length > 0) {
          pdfLinksHtml = `
            <div class="bg-blue-50/60 border border-blue-200/80 p-4 rounded-2xl space-y-2">
              <p class="text-xs font-black text-blue-900 uppercase tracking-wider flex items-center gap-1.5">
                <i class="fa-solid fa-link text-blue-600"></i> Official Itinerary Documents
              </p>
              <div class="flex flex-wrap gap-2 pt-1">
                ${pdfLinks.map(l => `
                  <a href="${l.url || '#'}" target="_blank" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition inline-flex items-center gap-2 shadow-sm border border-blue-500">
                    <span>${l.title || 'View Detailed Itinerary'}</span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-80"></i>
                  </a>
                `).join('')}
              </div>
            </div>
          `;
        }
      } catch (e) {}

      let itineraryHtml = '';
      try {
        let itineraryData = p.itinerary;
        if (typeof itineraryData === 'string' && itineraryData.trim() !== '') {
          try { itineraryData = JSON.parse(itineraryData); } catch(err) {}
        }

        if (Array.isArray(itineraryData) && itineraryData.length > 0) {
          let dayRows = '';
          itineraryData.forEach((day, idx) => {
            if (day && ((day.title && day.title.trim() !== '') || (day.desc && day.desc.trim() !== ''))) {
              dayRows += `
                <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl space-y-1 mb-3">
                  <h4 class="text-xs font-black uppercase text-blue-900 flex items-center gap-2">
                    <span class="w-6 h-6 bg-blue-600 text-white rounded-lg flex items-center justify-center text-[10px] font-bold">${idx + 1}</span>
                    ${day.title || ('Day ' + (idx + 1))}
                  </h4>
                  <p class="text-xs font-medium text-slate-700 pl-8 leading-relaxed whitespace-pre-line">${day.desc || ''}</p>
                </div>
              `;
            }
          });

          if (dayRows !== '') {
            itineraryHtml = `
              <div>
                <h3 class="text-sm font-black uppercase tracking-wider text-slate-900 mb-3 flex items-center gap-2">
                  <i class="fa-solid fa-route text-blue-600"></i> Tour Itinerary Details
                </h3>
                ${dayRows}
              </div>
            `;
          }
        }
      } catch (e) {
        itineraryHtml = '';
      }

      const inclusionsList = formatAsList(p.inclusions, 'fa-solid fa-circle-check text-emerald-600', 'text-slate-800');
      const exclusionsList = formatAsList(p.exclusions, 'fa-solid fa-circle-xmark text-rose-600', 'text-slate-800');
      const termsList = formatAsList(p.terms, 'fa-solid fa-angle-right text-blue-600', 'text-slate-700');

      const bannerImgUrl = p.imageUrl || 'https://images.unsplash.com/photo-1602216056096-3b40cc0c9944';

      document.getElementById('brochureContainer').innerHTML = `
        <!-- BROCHURE BANNER HEADER -->
        <div class="relative min-h-[220px] bg-slate-900 text-white p-8 sm:p-10 flex flex-col sm:flex-row sm:items-end justify-between gap-6 border-b-4 border-amber-400 overflow-hidden">
          <img src="${bannerImgUrl}" class="absolute inset-0 w-full h-full object-cover opacity-40 z-0" alt="Banner Image">
          <div class="relative z-10">
            <span class="px-3 py-1 rounded-full bg-blue-600/60 backdrop-blur-md border border-blue-400/40 text-amber-300 text-[10px] font-black uppercase tracking-wider">${p.destination || 'Destination Tour'} (${p.region || 'Domestic'})</span>
            <h1 class="text-2xl sm:text-4xl font-black mt-2 tracking-tight">${p.title || 'Holiday Package'}</h1>
            <p class="text-xs font-bold text-slate-200 mt-1"><i class="fa-regular fa-clock text-amber-400 mr-1"></i> Duration: ${p.duration || 'Flexible'}</p>
          </div>
          <div class="relative z-10 text-left sm:text-right bg-slate-900/80 backdrop-blur-md p-4 rounded-2xl border border-slate-700">
            <p class="text-[10px] font-extrabold uppercase text-slate-400 tracking-wider">Starting Net Rate</p>
            <p class="text-2xl sm:text-3xl font-black text-amber-400">${p.b2bPrice || 'On Request'}</p>
            <p class="text-[9px] text-slate-400 uppercase font-extrabold mt-0.5">B2B Agent Price</p>
          </div>
        </div>

        <div class="p-8 sm:p-10 space-y-8">
          ${pdfLinksHtml}

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-3">
              <p class="text-xs font-extrabold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
                <i class="fa-solid fa-square-check text-emerald-600 text-sm"></i> Inclusions
              </p>
              ${inclusionsList}
            </div>
            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-3">
              <p class="text-xs font-extrabold text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
                <i class="fa-solid fa-square-xmark text-rose-600 text-sm"></i> Exclusions
              </p>
              ${exclusionsList}
            </div>
          </div>

          <div>
            <h3 class="text-sm font-black uppercase tracking-wider text-slate-900 flex items-center gap-2 mb-3">
              <i class="fa-solid fa-table-cells text-blue-600"></i> Multi-Duration Supplier Rate Grids
            </h3>
            ${rateGridsHtml}
          </div>

          <div>
            <h3 class="text-sm font-black uppercase tracking-wider text-slate-900 mb-3 flex items-center gap-2">
              <i class="fa-solid fa-route text-blue-600"></i> Tour Itinerary Details
            </h3>
            ${itineraryHtml}
          </div>

          <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-3">
            <p class="text-xs font-extrabold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
              <i class="fa-solid fa-circle-info text-blue-600 text-sm"></i> Terms & Conditions / Policy
            </p>
            ${termsList}
          </div>

          <div class="pt-6 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between text-xs font-bold text-slate-500 gap-4">
            <p><i class="fa-solid fa-building text-blue-600 mr-1"></i> Journey Assist B2B Operations</p>
            <p><i class="fa-solid fa-phone text-blue-600 mr-1"></i> Helpline: +91 9919382999</p>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
