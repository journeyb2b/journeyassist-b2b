<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journey Assist | Super Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <header class="bg-slate-950 border-b border-slate-800 py-4 px-6 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black text-xl">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <div>
          <h1 class="text-xl font-black text-white">Journey Assist Admin</h1>
          <p class="text-[10px] text-amber-400 font-bold uppercase tracking-wider">Super Control Panel</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="refreshData()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl border border-slate-700 transition flex items-center gap-2">
          <i class="fa-solid fa-rotate text-blue-400"></i> Refresh Data
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-6 space-y-8">
    
    <!-- TABS NAVIGATION -->
    <div class="flex border-b border-slate-800 gap-4">
      <button id="btnTabPackages" onclick="switchAdminTab('packages')" class="pb-3 px-4 font-bold text-sm border-b-2 border-blue-500 text-blue-400 flex items-center gap-2">
        <i class="fa-solid fa-box-archive"></i> Manage Packages
      </button>
      <button id="btnTabAgents" onclick="switchAdminTab('agents')" class="pb-3 px-4 font-bold text-sm text-slate-400 hover:text-slate-200 border-b-2 border-transparent flex items-center gap-2">
        <i class="fa-solid fa-users"></i> Registered Agents
      </button>
    </div>

    <!-- ================= PACKAGES TAB ================= -->
    <div id="sectionPackages" class="space-y-6">
      
      <!-- ADD PACKAGE FORM -->
      <div class="bg-slate-950 p-6 rounded-3xl border border-slate-800 shadow-xl space-y-4">
        <h2 class="text-lg font-black text-white flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-emerald-400"></i> Add New Package
        </h2>

        <form id="addPackageForm" onsubmit="handleSavePackage(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs font-bold">
          <div>
            <label class="block text-slate-400 mb-1">Package Title *</label>
            <input type="text" id="pkgTitle" required placeholder="e.g. OBLU XPERIENCE AILAFUSHI - 4 star" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Destination *</label>
            <input type="text" id="pkgDestination" required placeholder="e.g. maldives / kerala" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Region *</label>
            <select id="pkgRegion" required class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-blue-500">
              <option value="international">International</option>
              <option value="domestic">Domestic</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Duration</label>
            <input type="text" id="pkgDuration" placeholder="3N/4D" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-white">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Category</label>
            <input type="text" id="pkgCategory" placeholder="4 Star" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-white">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">B2B Price *</label>
            <input type="text" id="pkgB2BPrice" required placeholder="USD 2,274 / Rs. 15,000" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-white">
          </div>
          <div class="md:col-span-3">
            <label class="block text-slate-400 mb-1">Inclusions</label>
            <input type="text" id="pkgInclusions" placeholder="All-inclusive / Transfers / Breakfast" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-white">
          </div>
          <div class="md:col-span-3">
            <label class="block text-slate-400 mb-1">Travel Dates / Validity</label>
            <input type="text" id="pkgTravelDates" placeholder="Travel 01 Nov 2026 - 23 Dec 2026" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-white">
          </div>
          <div class="md:col-span-3">
            <button type="submit" id="btnSavePkg" class="px-6 py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-extrabold rounded-xl transition shadow-lg flex items-center gap-2 cursor-pointer">
              <i class="fa-solid fa-save"></i> Save Package to Database
            </button>
          </div>
        </form>
      </div>

      <!-- LIVE PACKAGES LIST -->
      <div class="bg-slate-950 p-6 rounded-3xl border border-slate-800 shadow-xl space-y-4">
        <h2 class="text-lg font-black text-white">Active Packages List</h2>
        <div id="adminPackagesList" class="space-y-3">
          <p class="text-slate-500 text-xs font-bold py-4">Loading packages...</p>
        </div>
      </div>

    </div>

    <!-- ================= AGENTS TAB ================= -->
    <div id="sectionAgents" class="space-y-6 hidden">
      <div class="bg-slate-950 p-6 rounded-3xl border border-slate-800 shadow-xl space-y-4">
        <h2 class="text-lg font-black text-white">Registered B2B Agents</h2>
        <div id="adminAgentsList" class="space-y-3">
          <p class="text-slate-500 text-xs font-bold py-4">Loading registered agents...</p>
        </div>
      </div>
    </div>

  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCd7Xe2Sns5ZdIme5ZHXRIv3gl4O5abhKWivfBFACmUOMSH1BmSa3y1oAkUFKByS0QkQ/exec";

    window.onload = function() {
      refreshData();
    };

    function switchAdminTab(tab) {
      if (tab === 'packages') {
        document.getElementById('sectionPackages').classList.remove('hidden');
        document.getElementById('sectionAgents').classList.add('hidden');
        document.getElementById('btnTabPackages').className = "pb-3 px-4 font-bold text-sm border-b-2 border-blue-500 text-blue-400 flex items-center gap-2";
        document.getElementById('btnTabAgents').className = "pb-3 px-4 font-bold text-sm text-slate-400 hover:text-slate-200 border-b-2 border-transparent flex items-center gap-2";
      } else {
        document.getElementById('sectionPackages').classList.add('hidden');
        document.getElementById('sectionAgents').classList.remove('hidden');
        document.getElementById('btnTabAgents').className = "pb-3 px-4 font-bold text-sm border-b-2 border-blue-500 text-blue-400 flex items-center gap-2";
        document.getElementById('btnTabPackages').className = "pb-3 px-4 font-bold text-sm text-slate-400 hover:text-slate-200 border-b-2 border-transparent flex items-center gap-2";
      }
    }

    async function refreshData() {
      try {
        const response = await fetch(SCRIPT_URL + "?admin=true");
        const res = await response.json();
        
        if (res.packages) renderAdminPackages(res.packages);
        if (res.agents) renderAdminAgents(res.agents);
      } catch (err) {
        console.error("Fetch error:", err);
      }
    }

    function renderAdminPackages(packages) {
      const list = document.getElementById('adminPackagesList');
      if (packages.length === 0) {
        list.innerHTML = `<p class="text-slate-500 text-xs font-bold py-4">No packages added yet.</p>`;
        return;
      }

      let html = '';
      packages.forEach((p, i) => {
        html += `
          <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
            <div>
              <p class="font-extrabold text-white text-sm">${p.title}</p>
              <p class="text-xs font-semibold text-slate-400">${p.destination} (${p.region}) · ${p.b2bPrice}</p>
            </div>
            <span class="px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-black rounded-lg uppercase">Active</span>
          </div>
        `;
      });
      list.innerHTML = html;
    }

    function renderAdminAgents(agents) {
      const list = document.getElementById('adminAgentsList');
      if (agents.length === 0) {
        list.innerHTML = `<p class="text-slate-500 text-xs font-bold py-4">No agents registered yet.</p>`;
        return;
      }

      let html = '';
      agents.forEach((a) => {
        html += `
          <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
            <div>
              <p class="font-extrabold text-white text-sm">${a.fullName} (${a.agencyName})</p>
              <p class="text-xs font-semibold text-slate-400">${a.email} · Phone: ${a.phone} · City: ${a.city}</p>
            </div>
            <span class="px-3 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/20 text-[10px] font-black rounded-lg uppercase">Registered Partner</span>
          </div>
        `;
      });
      list.innerHTML = html;
    }

    async function handleSavePackage(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSavePkg');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Saving...`;

      const payload = {
        action: "add_package",
        title: document.getElementById('pkgTitle').value,
        destination: document.getElementById('pkgDestination').value.toLowerCase(),
        region: document.getElementById('pkgRegion').value.toLowerCase(),
        duration: document.getElementById('pkgDuration').value,
        category: document.getElementById('pkgCategory').value,
        b2bPrice: document.getElementById('pkgB2BPrice').value,
        inclusions: document.getElementById('pkgInclusions').value,
        travelDates: document.getElementById('pkgTravelDates').value
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const res = await response.json();

        if (res.success) {
          alert("Package saved successfully!");
          document.getElementById('addPackageForm').reset();
          refreshData();
        } else {
          alert("Error: " + res.message);
        }
      } catch (err) {
        alert("Connection error!");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-save"></i> Save Package to Database`;
      }
    }
  </script>
</body>
</html>
