<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Operations Control | Journey Assist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center font-bold text-white">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <h1 class="text-lg font-black tracking-tight text-white">Journey Assist <span class="text-xs text-amber-400 font-semibold uppercase">Admin Panel</span></h1>
      </div>
      <a href="index.html" class="text-xs font-bold text-slate-400 hover:text-white transition flex items-center gap-1.5">
        <i class="fa-solid fa-globe"></i> View B2B Portal
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">

    <div class="bg-slate-950 p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-xl space-y-6">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-black text-white" id="formHeading">Add New B2B Package & Supplier Rate Grid</h2>
          <p class="text-xs font-medium text-slate-400">Manage multi-duration rate grids and package brochure details.</p>
        </div>
        <button id="btnResetForm" onclick="resetForm()" class="hidden px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl transition cursor-pointer">
          <i class="fa-solid fa-plus mr-1"></i> Add New Package Mode
        </button>
      </div>

      <form id="packageForm" onsubmit="handleFormSubmit(event)" class="space-y-5 text-xs font-bold text-slate-300">
        <input type="hidden" id="editingPackageId" value="">

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block uppercase tracking-wider mb-1 text-slate-400">Package Title *</label>
            <input type="text" id="pkgTitle" required placeholder="e.g. Kerala Winter FIT — Early Bird Offer" class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block uppercase tracking-wider mb-1 text-slate-400">Destination *</label>
            <input type="text" id="pkgDestination" required placeholder="e.g. Kerala" class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block uppercase tracking-wider mb-1 text-slate-400">Region *</label>
            <select id="pkgRegion" required class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold focus:border-blue-500 focus:outline-none">
              <option value="domestic">Domestic</option>
              <option value="international">International</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block uppercase tracking-wider mb-1 text-slate-400">Duration Range *</label>
            <input type="text" id="pkgDuration" required placeholder="e.g. 3N/4D to 7N/8D" class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block uppercase tracking-wider mb-1 text-slate-400">Starting Price *</label>
            <input type="text" id="pkgPrice" required placeholder="e.g. ₹13,450/person" class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block uppercase tracking-wider mb-1 text-slate-400">Booking / Travel Validity</label>
            <input type="text" id="pkgDates" placeholder="e.g. Until 31 October 2026" class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold focus:border-blue-500 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block uppercase tracking-wider mb-1 text-slate-400">Banner Image URL</label>
            <input type="text" id="pkgImageUrl" placeholder="e.g. https://images.unsplash.com/..." class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block uppercase tracking-wider mb-1 text-slate-400">Terms & Conditions / Child Policy</label>
            <input type="text" id="pkgTerms" placeholder="e.g. Child rates applicable for 6–11 years" class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold focus:border-blue-500 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block uppercase tracking-wider mb-1 text-slate-400">Inclusions *</label>
            <input type="text" id="pkgInclusions" required placeholder="Accommodation, Daily breakfast, Transfers" class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block uppercase tracking-wider mb-1 text-slate-400">Exclusions *</label>
            <input type="text" id="pkgExclusions" required placeholder="Air / Train fares, Personal expenses" class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold focus:border-blue-500 focus:outline-none">
          </div>
        </div>

        <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
              <span class="text-xs font-black uppercase text-amber-400 flex items-center gap-2">
                <i class="fa-solid fa-table-cells"></i> Multi-Duration Supplier Rate Grid Blocks
              </span>
            </div>
            <button type="button" onclick="addDurationBlock()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 cursor-pointer">
              <i class="fa-solid fa-plus"></i> Add Duration Block
            </button>
          </div>

          <div id="builderBlocksContainer" class="space-y-6"></div>
        </div>

        <div>
          <label class="block uppercase tracking-wider mb-1 text-slate-400">Day-Wise Itinerary Details</label>
          <textarea id="pkgItinerary" rows="4" placeholder="Day 1: Arrival Cochin -> Transfer Munnar..." class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-medium focus:border-blue-500 focus:outline-none"></textarea>
        </div>

        <button type="submit" id="btnSubmitForm" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs uppercase tracking-wider rounded-2xl shadow-lg transition flex items-center justify-center gap-2 cursor-pointer">
          <i class="fa-solid fa-cloud-arrow-up text-amber-300"></i>
          <span id="btnSubmitText">Publish Package To Google Sheet</span>
        </button>
      </form>
    </div>

    <div class="bg-slate-950 p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-xl space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-black text-white">Live Database Packages</h3>
        <button onclick="fetchAdminPackages()" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-xs font-bold text-slate-300 rounded-xl border border-slate-800 transition cursor-pointer">
          <i class="fa-solid fa-rotate-right mr-1"></i> Refresh Table
        </button>
      </div>

      <div class="overflow-x-auto w-full">
        <table class="w-full text-left text-xs border-collapse min-w-[750px]">
          <thead>
            <tr class="bg-slate-900 text-slate-400 uppercase font-extrabold border-b border-slate-800">
              <th class="p-3 w-36 text-center bg-blue-900/40 text-amber-300 border-r border-slate-800">ACTIONS</th>
              <th class="p-3">ID</th>
              <th class="p-3">Title & Dest</th>
              <th class="p-3">Duration</th>
              <th class="p-3">Price</th>
              <th class="p-3">Status</th>
            </tr>
          </thead>
          <tbody id="adminPackagesTable" class="divide-y divide-slate-800">
            <tr>
              <td colspan="6" class="p-8 text-center text-slate-500 font-bold">Loading live packages...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCd7Xe2Sns5ZdIme5ZHXRIv3gl4O5abhKWivfBFACmUOMSH1BmSa3y1oAkUFKByS0QkQ/exec";
    let adminPackages = [];

    window.onload = function() {
      fetchAdminPackages();
      addDurationBlock("3N/4D Package", "2 Nights Munnar + 1 Night Kochi");
    };

    function addDurationBlock(title = "3N/4D Package", subtitle = "2 Nights Munnar + 1 Night Kochi", initialRows = null, headers = null) {
      const container = document.getElementById('builderBlocksContainer');
      const blockId = 'blk-' + Date.now() + Math.floor(Math.random() * 1000);

      const h1 = headers ? headers.h1 : "2 Pax Basis on CP";
      const h2 = headers ? headers.h2 : "2 Pax Basis on MAP";
      const h3 = headers ? headers.h3 : "4 Pax Basis on CP";
      const h4 = headers ? headers.h4 : "4 Pax Basis on MAP";
      const h5 = headers ? headers.h5 : "Extra Bed on CP";
      const h6 = headers ? headers.h6 : "Extra Bed on MAP";
      const h7 = headers ? headers.h7 : "Child W/O Bed on CP";
      const h8 = headers ? headers.h8 : "Child W/O Bed on MAP";

      const div = document.createElement('div');
      div.id = blockId;
      div.className = 'duration-block bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden space-y-3 pb-4';
      div.innerHTML = `
        <div class="bg-blue-600 px-4 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-white">
          <div class="flex items-center gap-3">
            <input type="text" value="${title}" class="b-title bg-blue-700 px-3 py-1 rounded-lg font-black text-xs text-white border border-blue-500 w-36 outline-none">
            <span class="text-xs font-bold text-blue-100 uppercase">Rate Grid Block</span>
          </div>
          <div class="flex items-center gap-2">
            <input type="text" value="${subtitle}" placeholder="Subtitle" class="b-sub bg-blue-700 px-3 py-1 rounded-lg font-bold text-xs text-white border border-blue-500 w-72 outline-none">
            <button type="button" onclick="document.getElementById('${blockId}').remove()" class="px-2.5 py-1 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs cursor-pointer"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
        <div class="px-4 overflow-x-auto">
          <table class="w-full text-left text-xs min-w-[1350px] border-collapse">
            <thead>
              <tr class="text-slate-400 uppercase text-[10px] border-b border-slate-800 font-extrabold bg-slate-900">
                <th class="p-2 w-32">Hotel Plan</th>
                <th class="p-2 w-28">Category</th>
                <th class="p-2"><input type="text" value="${h1}" class="th-h1 w-full px-2 py-1 bg-slate-950 border border-slate-800 rounded text-amber-300 font-bold text-[10px]"></th>
                <th class="p-2"><input type="text" value="${h2}" class="th-h2 w-full px-2 py-1 bg-slate-950 border border-slate-800 rounded text-amber-300 font-bold text-[10px]"></th>
                <th class="p-2"><input type="text" value="${h3}" class="th-h3 w-full px-2 py-1 bg-slate-950 border border-slate-800 rounded text-amber-300 font-bold text-[10px]"></th>
                <th class="p-2"><input type="text" value="${h4}" class="th-h4 w-full px-2 py-1 bg-slate-950 border border-slate-800 rounded text-amber-300 font-bold text-[10px]"></th>
                <th class="p-2"><input type="text" value="${h5}" class="th-h5 w-full px-2 py-1 bg-slate-950 border border-slate-800 rounded text-white font-bold text-[10px]"></th>
                <th class="p-2"><input type="text" value="${h6}" class="th-h6 w-full px-2 py-1 bg-slate-950 border border-slate-800 rounded text-white font-bold text-[10px]"></th>
                <th class="p-2"><input type="text" value="${h7}" class="th-h7 w-full px-2 py-1 bg-slate-950 border border-slate-800 rounded text-white font-bold text-[10px]"></th>
                <th class="p-2"><input type="text" value="${h8}" class="th-h8 w-full px-2 py-1 bg-slate-950 border border-slate-800 rounded text-white font-bold text-[10px]"></th>
                <th class="p-2 text-center w-16">Action</th>
              </tr>
            </thead>
            <tbody class="b-rows-container divide-y divide-slate-800/60"></tbody>
          </table>
          <button type="button" onclick="addRateRow('${blockId}')" class="mt-3 px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-amber-300 rounded-xl text-xs font-bold cursor-pointer transition flex items-center gap-1">
            <i class="fa-solid fa-plus"></i> Add Hotel Plan Row
          </button>
        </div>
      `;
      container.appendChild(div);

      if (initialRows && Array.isArray(initialRows)) {
        initialRows.forEach(r => addRateRow(blockId, r.plan, r.cat, r.v1, r.v2, r.v3, r.v4, r.v5, r.v6, r.v7, r.v8));
      } else {
        addRateRow(blockId, "Munnar", "Standard", "11,450", "13,450", "9,950", "11,950", "5,450", "6,450", "4,500", "5,500");
      }
    }

    function addRateRow(blockId, plan="Munnar", cat="Standard", v1="", v2="", v3="", v4="", v5="", v6="", v7="", v8="") {
      const block = document.getElementById(blockId);
      const tbody = block.querySelector('.b-rows-container');
      const rowId = 'r-' + Date.now() + Math.floor(Math.random() * 1000);

      const tr = document.createElement('tr');
      tr.id = rowId;
      tr.className = 'rate-row hover:bg-slate-900/50 transition';
      tr.innerHTML = `
        <td class="p-1.5"><input type="text" value="${plan}" class="r-plan w-full px-2 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-white font-bold text-xs"></td>
        <td class="p-1.5">
          <select class="r-cat w-full px-2 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-white font-bold text-xs">
            <option value="Standard" ${cat==='Standard'?'selected':''}>Standard</option>
            <option value="Deluxe" ${cat==='Deluxe'?'selected':''}>Deluxe</option>
            <option value="Premium" ${cat==='Premium'?'selected':''}>Premium</option>
            <option value="Luxury" ${cat==='Luxury'?'selected':''}>Luxury</option>
          </select>
        </td>
        <td class="p-1.5"><input type="text" value="${v1}" class="r-v1 w-full px-2 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-amber-300 font-extrabold text-xs"></td>
        <td class="p-1.5"><input type="text" value="${v2}" class="r-v2 w-full px-2 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-amber-300 font-extrabold text-xs"></td>
        <td class="p-1.5"><input type="text" value="${v3}" class="r-v3 w-full px-2 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-amber-300 font-extrabold text-xs"></td>
        <td class="p-1.5"><input type="text" value="${v4}" class="r-v4 w-full px-2 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-amber-300 font-extrabold text-xs"></td>
        <td class="p-1.5"><input type="text" value="${v5}" class="r-v5 w-full px-2 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-white font-bold text-xs"></td>
        <td class="p-1.5"><input type="text" value="${v6}" class="r-v6 w-full px-2 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-white font-bold text-xs"></td>
        <td class="p-1.5"><input type="text" value="${v7}" class="r-v7 w-full px-2 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-white font-bold text-xs"></td>
        <td class="p-1.5"><input type="text" value="${v8}" class="r-v8 w-full px-2 py-1.5 bg-slate-900 border border-slate-800 rounded-lg text-white font-bold text-xs"></td>
        <td class="p-1.5 text-center">
          <button type="button" onclick="document.getElementById('${rowId}').remove()" class="p-2 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white rounded-lg transition text-xs cursor-pointer"><i class="fa-solid fa-trash"></i></button>
        </td>
      `;
      tbody.appendChild(tr);
    }

    async function fetchAdminPackages() {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getPackages`);
        const data = await response.json();

        const pkgs = data.packages || (Array.isArray(data) ? data : []);
        adminPackages = pkgs;
        renderAdminTable(adminPackages);
      } catch (err) {
        document.getElementById('adminPackagesTable').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-rose-500 font-bold">Error connecting to database. Please refresh.</td></tr>`;
      }
    }

    function renderAdminTable(pkgs) {
      const tbody = document.getElementById('adminPackagesTable');
      if (!pkgs || pkgs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500 font-bold">No packages in database.</td></tr>`;
        return;
      }

      let html = '';
      pkgs.forEach((p, index) => {
        const status = (p.status || "OPEN").toUpperCase();
        const statusBadge = status === "PAUSED" 
          ? `<span class="px-2 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] font-black uppercase rounded-md">PAUSED</span>`
          : `<span class="px-2 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-black uppercase rounded-md">OPEN</span>`;

        html += `
          <tr class="hover:bg-slate-900/60 transition border-b border-slate-800">
            <td class="p-3 text-center bg-slate-950 border-r border-slate-800">
              <div class="flex items-center justify-center gap-1.5">
                <button onclick="editPackage(${index})" title="Edit Package" class="px-2.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-[11px] font-black rounded-lg shadow transition cursor-pointer">
                  <i class="fa-solid fa-pen"></i> Edit
                </button>
                <button onclick="deletePackage('${p.id}')" title="Delete Package" class="px-2.5 py-1.5 bg-rose-600 hover:bg-rose-500 text-white text-[11px] font-black rounded-lg shadow transition cursor-pointer">
                  <i class="fa-solid fa-trash"></i> Delete
                </button>
              </div>
            </td>
            <td class="p-3 font-mono font-bold text-slate-400">${p.id}</td>
            <td class="p-3">
              <p class="font-black text-white text-xs">${p.title}</p>
              <p class="text-[10px] font-bold text-slate-400">${p.destination} (${p.region})</p>
            </td>
            <td class="p-3 font-bold text-slate-300">${p.duration}</td>
            <td class="p-3 font-black text-blue-400">${p.b2bPrice}</td>
            <td class="p-3">${statusBadge}</td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

    function editPackage(index) {
      const p = adminPackages[index];
      if (!p) return;

      document.getElementById('editingPackageId').value = p.id;
      document.getElementById('pkgTitle').value = p.title || '';
      document.getElementById('pkgDestination').value = p.destination || '';
      document.getElementById('pkgRegion').value = (p.region || 'domestic').toLowerCase();
      document.getElementById('pkgDuration').value = p.duration || '';
      document.getElementById('pkgPrice').value = p.b2bPrice || '';
      document.getElementById('pkgDates').value = p.travelDates || '';
      document.getElementById('pkgInclusions').value = p.inclusions || '';
      document.getElementById('pkgExclusions').value = p.exclusions || '';
      document.getElementById('pkgImageUrl').value = p.imageUrl || '';
      document.getElementById('pkgTerms').value = p.terms || '';
      document.getElementById('pkgItinerary').value = p.itinerary || '';

      const builderContainer = document.getElementById('builderBlocksContainer');
      builderContainer.innerHTML = '';
      try {
        const gridBlocks = typeof p.ratesGrid === 'string' ? JSON.parse(p.ratesGrid) : p.ratesGrid;
        if (Array.isArray(gridBlocks) && gridBlocks.length > 0) {
          gridBlocks.forEach(blk => {
            addDurationBlock(blk.title || 'Package', blk.subtitle || '', blk.rows || [], blk.headers || null);
          });
        } else {
          addDurationBlock("3N/4D Package", "2 Nights Munnar + 1 Night Kochi");
        }
      } catch (e) {
        addDurationBlock("3N/4D Package", "2 Nights Munnar + 1 Night Kochi");
      }

      document.getElementById('formHeading').innerText = `Edit Package (${p.id})`;
      document.getElementById('btnSubmitText').innerText = "Update Package In Google Sheet";
      document.getElementById('btnResetForm').classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('editingPackageId').value = '';
      document.getElementById('packageForm').reset();
      document.getElementById('builderBlocksContainer').innerHTML = '';
      addDurationBlock("3N/4D Package", "2 Nights Munnar + 1 Night Kochi");
      document.getElementById('formHeading').innerText = "Add New B2B Package & Supplier Rate Grid";
      document.getElementById('btnSubmitText').innerText = "Publish Package To Google Sheet";
      document.getElementById('btnResetForm').classList.add('hidden');
    }

    async function handleFormSubmit(event) {
      event.preventDefault();
      const btn = document.getElementById('btnSubmitForm');
      btn.disabled = true;

      const blocks = document.querySelectorAll('.duration-block');
      const rateGridBlocksArr = [];

      blocks.forEach(blk => {
        const bTitle = blk.querySelector('.b-title').value.trim();
        const bSub = blk.querySelector('.b-sub').value.trim();
        
        const headersObj = {
          h1: blk.querySelector('.th-h1').value.trim(),
          h2: blk.querySelector('.th-h2').value.trim(),
          h3: blk.querySelector('.th-h3').value.trim(),
          h4: blk.querySelector('.th-h4').value.trim(),
          h5: blk.querySelector('.th-h5').value.trim(),
          h6: blk.querySelector('.th-h6').value.trim(),
          h7: blk.querySelector('.th-h7').value.trim(),
          h8: blk.querySelector('.th-h8').value.trim()
        };

        const rows = blk.querySelectorAll('.rate-row');
        const rowsArr = [];

        rows.forEach(r => {
          rowsArr.push({
            plan: r.querySelector('.r-plan').value.trim(),
            cat: r.querySelector('.r-cat').value,
            v1: r.querySelector('.r-v1').value.trim(),
            v2: r.querySelector('.r-v2').value.trim(),
            v3: r.querySelector('.r-v3').value.trim(),
            v4: r.querySelector('.r-v4').value.trim(),
            v5: r.querySelector('.r-v5').value.trim(),
            v6: r.querySelector('.r-v6').value.trim(),
            v7: r.querySelector('.r-v7').value.trim(),
            v8: r.querySelector('.r-v8').value.trim()
          });
        });

        if (bTitle || rowsArr.length > 0) {
          rateGridBlocksArr.push({
            title: bTitle || 'Package Block',
            subtitle: bSub,
            headers: headersObj,
            rows: rowsArr
          });
        }
      });

      const pkgId = document.getElementById('editingPackageId').value;
      const payload = {
        action: pkgId ? 'updatePackage' : 'addPackage',
        id: pkgId,
        title: document.getElementById('pkgTitle').value.trim(),
        destination: document.getElementById('pkgDestination').value.trim(),
        region: document.getElementById('pkgRegion').value,
        duration: document.getElementById('pkgDuration').value.trim(),
        b2bPrice: document.getElementById('pkgPrice').value.trim(),
        travelDates: document.getElementById('pkgDates').value.trim(),
        inclusions: document.getElementById('pkgInclusions').value.trim(),
        exclusions: document.getElementById('pkgExclusions').value.trim(),
        imageUrl: document.getElementById('pkgImageUrl').value.trim(),
        terms: document.getElementById('pkgTerms').value.trim(),
        itinerary: document.getElementById('pkgItinerary').value.trim(),
        ratesGrid: JSON.stringify(rateGridBlocksArr)
      };

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          alert(data.message || "Package saved successfully!");
          resetForm();
          fetchAdminPackages();
        } else {
          alert("Error: " + (data.message || "Failed"));
        }
      } catch (err) {
        alert("Connection error.");
      } finally {
        btn.disabled = false;
      }
    }

    async function deletePackage(id) {
      if (!confirm("Are you sure you want to PERMANENTLY delete this package?")) return;

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'deletePackage', id: id })
        });
        const data = await res.json();
        if (data.success) {
          alert("Package deleted successfully!");
          fetchAdminPackages();
        } else {
          alert("Failed to delete package");
        }
      } catch (e) {
        alert("Connection error");
      }
    }
  </script>
</body>
</html>
