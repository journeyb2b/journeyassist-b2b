<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Operations Control | Journey Assist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- HEADER -->
  <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center font-bold text-white">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <h1 class="text-lg font-black tracking-tight text-white">Journey Assist <span class="text-xs text-amber-400 font-semibold uppercase">Admin Panel</span></h1>
      </div>
      <a href="index.html" class="text-xs font-bold text-slate-400 hover:text-white transition flex items-center gap-1.5">
        <i class="fa-solid fa-globe"></i> View B2B Portal
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">

    <!-- ADD / EDIT PACKAGE FORM -->
    <div class="bg-slate-950 p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-xl space-y-6">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-black text-white" id="formHeading">Add New B2B Package</h2>
          <p class="text-xs font-medium text-slate-400">Fill in the details to publish or modify package on the portal.</p>
        </div>
        <button id="btnResetForm" onclick="resetForm()" class="hidden px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl transition">
          <i class="fa-solid fa-plus mr-1"></i> Add New Package Mode
        </button>
      </div>

      <form id="packageForm" onsubmit="handleFormSubmit(event)" class="space-y-4 text-xs font-bold text-slate-300">
        <input type="hidden" id="editingPackageId" value="">

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block uppercase tracking-wider mb-1 text-slate-400">Package Title *</label>
            <input type="text" id="pkgTitle" required placeholder="e.g. 3N/4D Classic Kerala Tour" class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block uppercase tracking-wider mb-1 text-slate-400">Destination *</label>
            <input type="text" id="pkgDestination" required placeholder="e.g. Kerala" class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block uppercase tracking-wider mb-1 text-slate-400">Region *</label>
            <select id="pkgRegion" required class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold focus:border-blue-500 focus:outline-none">
              <option value="domestic">Domestic</option>
              <option value="international">International</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block uppercase tracking-wider mb-1 text-slate-400">Duration *</label>
            <input type="text" id="pkgDuration" required placeholder="e.g. 3 Nights / 4 Days" class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block uppercase tracking-wider mb-1 text-slate-400">B2B Net Starting Price *</label>
            <input type="text" id="pkgPrice" required placeholder="e.g. ₹12,500" class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block uppercase tracking-wider mb-1 text-slate-400">Travel Dates / Validity</label>
            <input type="text" id="pkgDates" placeholder="e.g. Valid till March 2027" class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold focus:border-blue-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block uppercase tracking-wider mb-1 text-slate-400">Inclusions *</label>
          <input type="text" id="pkgInclusions" required placeholder="e.g. Hotels, Breakfast, AC Cab, Sightseeing" class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold focus:border-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block uppercase tracking-wider mb-1 text-slate-400">Day-Wise Itinerary Details</label>
          <textarea id="pkgItinerary" rows="4" placeholder="Day 1: Arrival & Cochin sightseeing...&#10;Day 2: Transfer to Munnar..." class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-medium focus:border-blue-500 focus:outline-none"></textarea>
        </div>

        <button type="submit" id="btnSubmitForm" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs uppercase tracking-wider rounded-2xl shadow-lg transition flex items-center justify-center gap-2 cursor-pointer">
          <i class="fa-solid fa-cloud-arrow-up text-amber-300"></i>
          <span id="btnSubmitText">Publish Package To Google Sheet</span>
        </button>
      </form>
    </div>

    <!-- LIVE PACKAGES TABLE WITH CONTROLS -->
    <div class="bg-slate-950 p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-xl space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-black text-white">Live Database Packages</h3>
        <button onclick="fetchAdminPackages()" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-xs font-bold text-slate-300 rounded-xl border border-slate-800 transition">
          <i class="fa-solid fa-rotate-right mr-1"></i> Refresh Table
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-slate-900 text-slate-400 uppercase font-extrabold border-b border-slate-800">
              <th class="p-3">ID</th>
              <th class="p-3">Title & Dest</th>
              <th class="p-3">Duration</th>
              <th class="p-3">Price</th>
              <th class="p-3">Status</th>
              <th class="p-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="adminPackagesTable" class="divide-y divide-slate-800">
            <tr>
              <td colspan="6" class="p-8 text-center text-slate-500 font-bold">Loading live packages...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCd7Xe2Sns5ZdIme5ZHXRIv3gl4O5abhKWivfBFACmUOMSH1BmSa3y1oAkUFKByS0QkQ/exec";
    let adminPackages = [];

    window.onload = function() {
      fetchAdminPackages();
    };

    async function fetchAdminPackages() {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getPackages`);
        const data = await response.json();

        if (data.success && data.packages) {
          adminPackages = data.packages;
          renderAdminTable(adminPackages);
        } else {
          document.getElementById('adminPackagesTable').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-rose-500 font-bold">No packages found or failed to load.</td></tr>`;
        }
      } catch (err) {
        document.getElementById('adminPackagesTable').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-rose-500 font-bold">Error connecting to database.</td></tr>`;
      }
    }

    function renderAdminTable(pkgs) {
      const tbody = document.getElementById('adminPackagesTable');
      if (pkgs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500 font-bold">No packages in database.</td></tr>`;
        return;
      }

      let html = '';
      pkgs.forEach((p, index) => {
        const status = (p.status || "OPEN").toUpperCase();
        const isPaused = status === "PAUSED";
        const statusBadge = isPaused 
          ? `<span class="px-2 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] font-black uppercase rounded-md">PAUSED</span>`
          : `<span class="px-2 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-black uppercase rounded-md">OPEN</span>`;

        html += `
          <tr class="hover:bg-slate-900/60 transition">
            <td class="p-3 font-mono font-bold text-slate-400">${p.id}</td>
            <td class="p-3">
              <p class="font-black text-white">${p.title}</p>
              <p class="text-[10px] font-bold text-slate-400">${p.destination} (${p.region})</p>
            </td>
            <td class="p-3 font-bold text-slate-300">${p.duration}</td>
            <td class="p-3 font-black text-blue-400">${p.b2bPrice}</td>
            <td class="p-3">${statusBadge}</td>
            <td class="p-3 text-right">
              <div class="flex items-center justify-end gap-2">
                <button onclick="editPackage(${index})" title="Edit Package" class="px-3 py-1.5 bg-blue-600/20 hover:bg-blue-600 border border-blue-500/40 text-blue-300 hover:text-white text-xs font-bold rounded-lg transition">
                  <i class="fa-solid fa-pen"></i> Edit
                </button>
                <button onclick="togglePackageStatus('${p.id}', '${status}')" title="${isPaused ? 'Resume Package' : 'Pause Package'}" class="px-3 py-1.5 ${isPaused ? 'bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 border-emerald-500/40' : 'bg-amber-600/20 hover:bg-amber-600 text-amber-300 border-amber-500/40'} border hover:text-white text-xs font-bold rounded-lg transition">
                  <i class="fa-solid ${isPaused ? 'fa-play' : 'fa-pause'}"></i> ${isPaused ? 'Resume' : 'Pause'}
                </button>
                <button onclick="deletePackage('${p.id}')" title="Delete Package" class="px-3 py-1.5 bg-rose-600/20 hover:bg-rose-600 border border-rose-500/40 text-rose-300 hover:text-white text-xs font-bold rounded-lg transition">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
    }

    function editPackage(index) {
      const p = adminPackages[index];
      if (!p) return;

      document.getElementById('editingPackageId').value = p.id;
      document.getElementById('pkgTitle').value = p.title || '';
      document.getElementById('pkgDestination').value = p.destination || '';
      document.getElementById('pkgRegion').value = (p.region || 'domestic').toLowerCase();
      document.getElementById('pkgDuration').value = p.duration || '';
      document.getElementById('pkgPrice').value = p.b2bPrice || '';
      document.getElementById('pkgDates').value = p.travelDates || '';
      document.getElementById('pkgInclusions').value = p.inclusions || '';
      document.getElementById('pkgItinerary').value = p.itinerary || '';

      document.getElementById('formHeading').innerText = `Edit Package (${p.id})`;
      document.getElementById('btnSubmitText').innerText = "Update Package In Google Sheet";
      document.getElementById('btnResetForm').classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('editingPackageId').value = '';
      document.getElementById('packageForm').reset();
      document.getElementById('formHeading').innerText = "Add New B2B Package";
      document.getElementById('btnSubmitText').innerText = "Publish Package To Google Sheet";
      document.getElementById('btnResetForm').classList.add('hidden');
    }

    async function handleFormSubmit(event) {
      event.preventDefault();

      const btn = document.getElementById('btnSubmitForm');
      btn.disabled = true;
      btn.classList.add('opacity-50');

      const pkgId = document.getElementById('editingPackageId').value;

      const payload = {
        action: pkgId ? 'updatePackage' : 'addPackage',
        id: pkgId,
        title: document.getElementById('pkgTitle').value.trim(),
        destination: document.getElementById('pkgDestination').value.trim(),
        region: document.getElementById('pkgRegion').value,
        duration: document.getElementById('pkgDuration').value.trim(),
        b2bPrice: document.getElementById('pkgPrice').value.trim(),
        travelDates: document.getElementById('pkgDates').value.trim(),
        inclusions: document.getElementById('pkgInclusions').value.trim(),
        itinerary: document.getElementById('pkgItinerary').value.trim()
      };

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          alert(data.message || "Saved successfully!");
          resetForm();
          fetchAdminPackages();
        } else {
          alert("Error: " + (data.message || "Failed to save package"));
        }
      } catch (err) {
        alert("Connection error. Could not save package.");
      } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-50');
      }
    }

    async function togglePackageStatus(id, currentStatus) {
      const newStatus = currentStatus === 'PAUSED' ? 'OPEN' : 'PAUSED';
      if (!confirm(`Are you sure you want to set status to ${newStatus}?`)) return;

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'updatePackageStatus', id: id, status: newStatus })
        });
        const data = await res.json();
        if (data.success) {
          fetchAdminPackages();
        } else {
          alert("Failed to update status");
        }
      } catch (e) {
        alert("Connection error");
      }
    }

    async function deletePackage(id) {
      if (!confirm("Are you sure you want to permanently DELETE this package?")) return;

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'deletePackage', id: id })
        });
        const data = await res.json();
        if (data.success) {
          alert("Package deleted!");
          fetchAdminPackages();
        } else {
          alert("Failed to delete package");
        }
      } catch (e) {
        alert("Connection error");
      }
    }
  </script>
</body>
</html>
