<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journey Assist | Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold">
          <i class="fa-solid fa-gear text-amber-300"></i>
        </div>
        <div>
          <h1 class="text-lg font-black tracking-tight">Journey Assist Admin</h1>
          <p class="text-[10px] uppercase font-bold text-blue-400">Package Manager</p>
        </div>
      </div>
      <a href="index.html" target="_blank" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold transition flex items-center gap-2">
        <i class="fa-solid fa-arrow-up-right-from-square"></i> View Live Portal
      </a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">
    <div class="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl shadow-xl space-y-6">
      
      <div class="border-b border-slate-800 pb-4">
        <h2 class="text-xl font-black text-white">Add / Update Holiday Package</h2>
        <p class="text-xs text-slate-400 mt-1">Configure package details. Pricing will automatically display as "On Request" on the portal.</p>
      </div>

      <form id="packageForm" onsubmit="savePackage(event)" class="space-y-6 text-xs font-bold">
        <input type="hidden" id="pkgId">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block uppercase tracking-wider text-slate-400 mb-1">Package Title *</label>
            <input type="text" id="pkgTitle" required placeholder="e.g. Majestic Kerala Honeymoon Bliss" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 focus:border-blue-600 focus:outline-none">
          </div>
          <div>
            <label class="block uppercase tracking-wider text-slate-400 mb-1">Destination Name *</label>
            <input type="text" id="pkgDestination" required placeholder="e.g. Kerala / Maldives / Bali" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 focus:border-blue-600 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block uppercase tracking-wider text-slate-400 mb-1">Region Type *</label>
            <select id="pkgRegion" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 focus:border-blue-600 focus:outline-none">
              <option value="domestic">Domestic</option>
              <option value="international">International</option>
            </select>
          </div>
          <div>
            <label class="block uppercase tracking-wider text-slate-400 mb-1">Travel Validity / Dates</label>
            <input type="text" id="pkgDates" placeholder="e.g. Valid till March 2026" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 focus:border-blue-600 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block uppercase tracking-wider text-slate-400 mb-1">Package Inclusions *</label>
          <input type="text" id="pkgInclusions" required placeholder="e.g. 4 Nights Hotel + Sightseeing + Transfers + Breakfast" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-slate-200 focus:border-blue-600 focus:outline-none">
        </div>

        <!-- HOTEL CATEGORIES CONTAINER -->
        <div class="space-y-3 pt-2">
          <div class="flex items-center justify-between">
            <label class="uppercase tracking-wider text-slate-300">Hotel Categories & Rooms Mapping</label>
            <button type="button" onclick="addHotelRow()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-[10px] font-extrabold">+ Add Hotel</button>
          </div>
          <div id="hotelRowsContainer" class="space-y-3"></div>
        </div>

        <!-- DAY WISE ITINERARY CONTAINER -->
        <div class="space-y-3 pt-2">
          <div class="flex items-center justify-between">
            <label class="uppercase tracking-wider text-slate-300">Day-Wise Itinerary</label>
            <button type="button" onclick="addItineraryDay()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-[10px] font-extrabold">+ Add Day</button>
          </div>
          <div id="itineraryRowsContainer" class="space-y-3"></div>
        </div>

        <button type="submit" id="btnSave" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-black uppercase tracking-wider rounded-xl shadow-lg transition cursor-pointer">
          Save & Publish Package
        </button>
      </form>
    </div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCd7Xe2Sns5ZdIme5ZHXRIv3gl4O5abhKWivfBFACmUOMSH1BmSa3y1oAkUFKByS0QkQ/exec";

    function addHotelRow(cat='', room='', hotels='') {
      const container = document.getElementById('hotelRowsContainer');
      const div = document.createElement('div');
      div.className = 'grid grid-cols-1 sm:grid-cols-3 gap-2 bg-slate-950 p-3 rounded-xl border border-slate-800 hotel-row';
      div.innerHTML = `
        <input type="text" placeholder="Category (e.g. 3 Star)" value="${cat}" class="hotel-cat px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-slate-200">
        <input type="text" placeholder="Room Type (e.g. Deluxe Room)" value="${room}" class="hotel-room px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-slate-200">
        <div class="flex gap-2">
          <input type="text" placeholder="Hotel Name(s)" value="${hotels}" class="hotel-name flex-1 px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-slate-200">
          <button type="button" onclick="this.closest('.hotel-row').remove()" class="px-3 py-2 bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white rounded-lg">✕</button>
        </div>
      `;
      container.appendChild(div);
    }

    function addItineraryDay(title='', desc='') {
      const container = document.getElementById('itineraryRowsContainer');
      const div = document.createElement('div');
      div.className = 'bg-slate-950 p-3 rounded-xl border border-slate-800 itinerary-row space-y-2';
      div.innerHTML = `
        <div class="flex items-center justify-between">
          <input type="text" placeholder="Day Title (e.g. Day 1: Arrival in Munnar)" value="${title}" class="itinerary-title w-3/4 px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-slate-200">
          <button type="button" onclick="this.closest('.itinerary-row').remove()" class="px-3 py-2 bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white rounded-lg">Remove</button>
        </div>
        <textarea placeholder="Detailed description for this day..." class="itinerary-desc w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-slate-200" rows="2">${desc}</textarea>
      `;
      container.appendChild(div);
    }

    async function savePackage(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSave');
      btn.innerText = "Saving package...";

      // Gather Hotels
      const hotels = [];
      document.querySelectorAll('.hotel-row').forEach(row => {
        hotels.push({
          category: row.querySelector('.hotel-cat').value.trim(),
          room: row.querySelector('.hotel-room').value.trim(),
          hotels: row.querySelector('.hotel-name').value.trim()
        });
      });

      // Gather Itinerary
      const itinerary = [];
      document.querySelectorAll('.itinerary-row').forEach(row => {
        itinerary.push({
          title: row.querySelector('.itinerary-title').value.trim(),
          desc: row.querySelector('.itinerary-desc').value.trim()
        });
      });

      const payload = {
        action: 'addPackage',
        id: document.getElementById('pkgId').value || 'pkg_' + Date.now(),
        title: document.getElementById('pkgTitle').value.trim(),
        destination: document.getElementById('pkgDestination').value.trim(),
        region: document.getElementById('pkgRegion').value.trim(),
        travelDates: document.getElementById('pkgDates').value.trim(),
        inclusions: document.getElementById('pkgInclusions').value.trim(),
        b2bPrice: 'On Request',
        hotels: JSON.stringify(hotels),
        itinerary: JSON.stringify(itinerary),
        itineraryLink: ''
      };

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          alert("Package saved successfully!");
          document.getElementById('packageForm').reset();
          document.getElementById('hotelRowsContainer').innerHTML = '';
          document.getElementById('itineraryRowsContainer').innerHTML = '';
          addHotelRow();
          addItineraryDay();
        } else {
          alert("Error: " + (data.message || 'Could not save'));
        }
      } catch (err) {
        alert("Connection error while saving package.");
      } finally {
        btn.innerText = "Save & Publish Package";
      }
    }

    window.onload = () => {
      addHotelRow('3 Star Standard', 'Deluxe Room', 'Standard Resort');
      addItineraryDay('Day 1: Arrival', 'Arrive at destination and check-in.');
    };
  </script>
</body>
</html>
