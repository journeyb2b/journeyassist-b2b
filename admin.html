<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journey Assist | Super Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <header class="bg-slate-950 border-b border-slate-800 py-4 px-6 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black text-xl">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <div>
          <h1 class="text-xl font-black text-white">Journey Assist Admin</h1>
          <p class="text-[10px] text-amber-400 font-bold uppercase tracking-wider">Super Control Panel</p>
        </div>
      </div>
      <button onclick="refreshData()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl border border-slate-700 transition flex items-center gap-2 cursor-pointer">
        <i class="fa-solid fa-rotate text-blue-400"></i> Refresh Data
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-6 space-y-8">
    
    <!-- TABS -->
    <div class="flex border-b border-slate-800 gap-4">
      <button id="btnTabPackages" onclick="switchAdminTab('packages')" class="pb-3 px-4 font-bold text-sm border-b-2 border-blue-500 text-blue-400 flex items-center gap-2 cursor-pointer">
        <i class="fa-solid fa-box-archive"></i> Manage Packages (<span id="pkgCount">0</span>)
      </button>
      <button id="btnTabAgents" onclick="switchAdminTab('agents')" class="pb-3 px-4 font-bold text-sm text-slate-400 hover:text-slate-200 border-b-2 border-transparent flex items-center gap-2 cursor-pointer">
        <i class="fa-solid fa-users"></i> Registered Agents (<span id="agentCount">0</span>)
      </button>
    </div>

    <!-- ================= PACKAGES SECTION ================= -->
    <div id="sectionPackages" class="space-y-6">

      <!-- PACKAGE FORM (CREATE / EDIT) -->
      <div class="bg-slate-950 p-6 rounded-3xl border border-slate-800 shadow-xl space-y-4">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
          <h2 class="text-lg font-black text-white flex items-center gap-2" id="pkgFormTitle">
            <i class="fa-solid fa-plus-circle text-blue-400"></i> Add New Package
          </h2>
          <button id="btnCancelPkgEdit" onclick="resetPackageForm()" class="hidden px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-lg cursor-pointer">
            Cancel Edit
          </button>
        </div>

        <form id="addPackageForm" onsubmit="handleSavePackage(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs font-bold">
          <input type="hidden" id="pkgRowIndex" value="">
          <div>
            <label class="block text-slate-400 mb-1">Package Title *</label>
            <input type="text" id="pkgTitle" required placeholder="e.g. Kerala Winter FIT" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-white">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Destination *</label>
            <input type="text" id="pkgDestination" required placeholder="e.g. kerala" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-white">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Region *</label>
            <select id="pkgRegion" required class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-white">
              <option value="domestic">Domestic</option>
              <option value="international">International</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Duration</label>
            <input type="text" id="pkgDuration" placeholder="3N/4D to 7N/8D" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-white">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Category</label>
            <input type="text" id="pkgCategory" placeholder="3 Star / 4 Star" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-white">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">B2B Price *</label>
            <input type="text" id="pkgB2BPrice" required placeholder="Starting ₹13,450/person" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-white">
          </div>
          <div class="md:col-span-3">
            <label class="block text-slate-400 mb-1">Inclusions</label>
            <input type="text" id="pkgInclusions" placeholder="Accommodation as per itinerary, Daily breakfast, Transfers & sightseeing" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-white">
          </div>
          <div class="md:col-span-3">
            <label class="block text-slate-400 mb-1">Travel Dates / Validity</label>
            <input type="text" id="pkgTravelDates" placeholder="Booking window: Until 31 October 2026" class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-white">
          </div>
          <div class="md:col-span-3">
            <label class="block text-slate-400 mb-1">Rate Grid / Pricing Options (Brochure Table)</label>
            <textarea id="pkgRatesGrid" rows="4" placeholder="Enter structured rate grid text or table details..." class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-white font-mono"></textarea>
          </div>
          <div class="md:col-span-3">
            <label class="block text-slate-400 mb-1">Detailed Itinerary</label>
            <textarea id="pkgItinerary" rows="4" placeholder="Day 1: Arrival & Transfer&#10;Day 2: Sightseeing..." class="w-full p-3 bg-slate-900 border border-slate-800 rounded-xl text-white"></textarea>
          </div>
          <div class="md:col-span-3">
            <button type="submit" id="btnSavePkg" class="px-6 py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-extrabold rounded-xl transition shadow-lg flex items-center gap-2 cursor-pointer">
              <i class="fa-solid fa-save"></i> <span id="btnSavePkgText">Save Package</span>
            </button>
          </div>
        </form>
      </div>

      <!-- PACKAGES LIST TABLE -->
      <div class="bg-slate-950 p-6 rounded-3xl border border-slate-800 shadow-xl space-y-4">
        <h2 class="text-lg font-black text-white">Packages Control List</h2>
        <div id="adminPackagesList" class="space-y-3">
          <p class="text-slate-500 text-xs font-bold py-4">Loading packages...</p>
        </div>
      </div>

    </div>

    <!-- ================= AGENTS SECTION ================= -->
    <div id="sectionAgents" class="space-y-6 hidden">
      <div class="bg-slate-950 p-6 rounded-3xl border border-slate-800 shadow-xl space-y-4">
        <h2 class="text-lg font-black text-white">Registered Agents Control List</h2>
        <div id="adminAgentsList" class="space-y-3">
          <p class="text-slate-500 text-xs font-bold py-4">Loading registered agents...</p>
        </div>
      </div>
    </div>

  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCd7Xe2Sns5ZdIme5ZHXRIv3gl4O5abhKWivfBFACmUOMSH1BmSa3y1oAkUFKByS0QkQ/exec";
    let cachePackages = [];
    let cacheAgents = [];

    window.onload = function() { refreshData(); };

    function switchAdminTab(tab) {
      if (tab === 'packages') {
        document.getElementById('sectionPackages').classList.remove('hidden');
        document.getElementById('sectionAgents').classList.add('hidden');
        document.getElementById('btnTabPackages').className = "pb-3 px-4 font-bold text-sm border-b-2 border-blue-500 text-blue-400 flex items-center gap-2 cursor-pointer";
        document.getElementById('btnTabAgents').className = "pb-3 px-4 font-bold text-sm text-slate-400 hover:text-slate-200 border-b-2 border-transparent flex items-center gap-2 cursor-pointer";
      } else {
        document.getElementById('sectionPackages').classList.add('hidden');
        document.getElementById('sectionAgents').classList.remove('hidden');
        document.getElementById('btnTabAgents').className = "pb-3 px-4 font-bold text-sm border-b-2 border-blue-500 text-blue-400 flex items-center gap-2 cursor-pointer";
        document.getElementById('btnTabPackages').className = "pb-3 px-4 font-bold text-sm text-slate-400 hover:text-slate-200 border-b-2 border-transparent flex items-center gap-2 cursor-pointer";
      }
    }

    async function refreshData() {
      try {
        const response = await fetch(SCRIPT_URL + "?admin=true");
        const res = await response.json();
        if (res.packages) {
          cachePackages = res.packages;
          document.getElementById('pkgCount').innerText = res.packages.length;
          renderAdminPackages(res.packages);
        }
        if (res.agents) {
          cacheAgents = res.agents;
          document.getElementById('agentCount').innerText = res.agents.length;
          renderAdminAgents(res.agents);
        }
      } catch (err) { console.error("Fetch error:", err); }
    }

    function renderAdminPackages(packages) {
      const list = document.getElementById('adminPackagesList');
      if (packages.length === 0) {
        list.innerHTML = `<p class="text-slate-500 text-xs font-bold py-4">No packages added yet.</p>`;
        return;
      }
      let html = '';
      packages.forEach((p, idx) => {
        const isPaused = p.status_active === "Paused";
        const badge = isPaused 
          ? `<span class="px-2.5 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 text-[10px] font-black rounded-lg uppercase">Paused</span>` 
          : `<span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-black rounded-lg uppercase">Active</span>`;

        html += `
          <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <p class="font-extrabold text-white text-sm">${p.title}</p>
                ${badge}
              </div>
              <p class="text-xs font-semibold text-slate-400">${p.destination} (${p.region}) · B2B: ${p.b2bPrice} · ${p.duration}</p>
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
              <button onclick="editPackage(${idx})" class="px-3 py-1.5 bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white text-xs font-bold rounded-xl border border-blue-500/30 transition flex items-center gap-1 cursor-pointer">
                <i class="fa-solid fa-pen-to-square"></i> Edit
              </button>
              <button onclick="togglePackageStatus(${p.rowIndex}, '${isPaused ? 'Active' : 'Paused'})" class="px-3 py-1.5 ${isPaused ? 'bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400' : 'bg-amber-600/20 hover:bg-amber-600 text-amber-400'} hover:text-white text-xs font-bold rounded-xl border border-slate-700 transition flex items-center gap-1 cursor-pointer">
                <i class="fa-solid ${isPaused ? 'fa-play' : 'fa-pause'}"></i> ${isPaused ? 'Resume' : 'Pause'}
              </button>
              <button onclick="deletePackage(${p.rowIndex})" class="px-3 py-1.5 bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white text-xs font-bold rounded-xl border border-rose-500/30 transition flex items-center gap-1 cursor-pointer">
                <i class="fa-solid fa-trash"></i> Delete
              </button>
            </div>
          </div>
        `;
      });
      list.innerHTML = html;
    }

    function editPackage(idx) {
      const p = cachePackages[idx];
      if (!p) return;
      document.getElementById('pkgRowIndex').value = p.rowIndex;
      document.getElementById('pkgTitle').value = p.title;
      document.getElementById('pkgDestination').value = p.destination;
      document.getElementById('pkgRegion').value = p.region;
      document.getElementById('pkgDuration').value = p.duration;
      document.getElementById('pkgCategory').value = p.category;
      document.getElementById('pkgB2BPrice').value = p.b2bPrice;
      document.getElementById('pkgInclusions').value = p.inclusions;
      document.getElementById('pkgTravelDates').value = p.travelDates;
      document.getElementById('pkgRatesGrid').value = p.ratesGrid;
      document.getElementById('pkgItinerary').value = p.itinerary;

      document.getElementById('pkgFormTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-amber-400"></i> Edit Package (${p.code})`;
      document.getElementById('btnSavePkgText').innerText = "Update Package";
      document.getElementById('btnCancelPkgEdit').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetPackageForm() {
      document.getElementById('addPackageForm').reset();
      document.getElementById('pkgRowIndex').value = "";
      document.getElementById('pkgFormTitle').innerHTML = `<i class="fa-solid fa-plus-circle text-blue-400"></i> Add New Package`;
      document.getElementById('btnSavePkgText').innerText = "Save Package";
      document.getElementById('btnCancelPkgEdit').classList.add('hidden');
    }

    async function handleSavePackage(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSavePkg');
      btn.disabled = true;

      const payload = {
        action: "save_package",
        rowIndex: document.getElementById('pkgRowIndex').value,
        title: document.getElementById('pkgTitle').value,
        destination: document.getElementById('pkgDestination').value.toLowerCase(),
        region: document.getElementById('pkgRegion').value.toLowerCase(),
        duration: document.getElementById('pkgDuration').value,
        category: document.getElementById('pkgCategory').value,
        b2bPrice: document.getElementById('pkgB2BPrice').value,
        inclusions: document.getElementById('pkgInclusions').value,
        travelDates: document.getElementById('pkgTravelDates').value,
        ratesGrid: document.getElementById('pkgRatesGrid').value,
        itinerary: document.getElementById('pkgItinerary').value
      };

      try {
        const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        const res = await response.json();
        if (res.success) {
          alert("Package saved successfully!");
          resetPackageForm();
          refreshData();
        } else alert("Error: " + res.message);
      } catch (err) { alert("Connection error!"); } 
      finally { btn.disabled = false; }
    }

    async function togglePackageStatus(rowIndex, newStatus) {
      if (!confirm(`Are you sure you want to change status to ${newStatus}?`)) return;
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: "toggle_package_status", rowIndex: rowIndex, status_active: newStatus })
        });
        const res = await response.json();
        if (res.success) refreshData();
      } catch (err) { alert("Error updating status!"); }
    }

    async function deletePackage(rowIndex) {
      if (!confirm("Are you sure you want to permanently delete this package?")) return;
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: "delete_package", rowIndex: rowIndex })
        });
        const res = await response.json();
        if (res.success) refreshData();
      } catch (err) { alert("Error deleting package!"); }
    }

    function renderAdminAgents(agents) {
      const list = document.getElementById('adminAgentsList');
      if (agents.length === 0) {
        list.innerHTML = `<p class="text-slate-500 text-xs font-bold py-4">No agents registered yet.</p>`;
        return;
      }
      let html = '';
      agents.forEach((a, idx) => {
        html += `
          <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
            <div>
              <p class="font-extrabold text-white text-sm">${a.fullName} (${a.agencyName})</p>
              <p class="text-xs font-semibold text-slate-400">${a.email} · Phone: ${a.phone} · City: ${a.city}</p>
            </div>
            <span class="px-3 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/20 text-[10px] font-black rounded-lg uppercase">Active Agent</span>
          </div>
        `;
      });
      list.innerHTML = html;
    }
  </script>
</body>
</html>
