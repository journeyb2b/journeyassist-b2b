<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journey Assist | Advanced B2B Rate Grid & Package Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- HEADER -->
  <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-sky-500 rounded-xl flex items-center justify-center font-black text-slate-950">
          <i class="fa-solid fa-sliders"></i>
        </div>
        <div>
          <h1 class="text-base font-black tracking-tight text-white">Journey Assist <span class="text-xs text-sky-400 font-bold">B2B Admin Desk</span></h1>
        </div>
      </div>
      <div class="flex items-center gap-2 text-xs font-bold text-slate-400">
        <span class="px-3 py-1 bg-sky-500/20 text-sky-400 border border-sky-500/30 rounded-full flex items-center gap-1.5">
          <i class="fa-solid fa-shield-halved"></i> Supplier Rate Grid Manager
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">

    <!-- PACKAGE RATE GRID CREATOR FORM -->
    <div class="bg-slate-950 p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6">
      
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">
        <div>
          <h2 class="text-lg font-black text-white flex items-center gap-2">
            <i class="fa-solid fa-layer-group text-sky-400"></i> Multi-Duration & Vehicle Rate Grid Setup
          </h2>
          <p class="text-xs text-slate-400 font-medium">Create multi-day itineraries, night splits, vehicle options, and wholesale rates.</p>
        </div>
        <button onclick="saveRateGridPackage()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-black transition flex items-center gap-2 shadow-lg shadow-emerald-900/30">
          <i class="fa-solid fa-cloud-arrow-up"></i> Save Package Grid
        </button>
      </div>

      <!-- BASIC DETAILS -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="text-[10px] font-black uppercase text-slate-400">Destination Name</label>
          <input type="text" id="destName" value="Kerala" placeholder="e.g. Kerala, Kashmir, Maldives" class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold text-xs focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="text-[10px] font-black uppercase text-slate-400">Hotel Category / Tier</label>
          <select id="hotelCategory" class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold text-xs focus:outline-none focus:border-sky-500">
            <option value="3 Star Standard">3 Star Standard</option>
            <option value="4 Star Deluxe" selected>4 Star Deluxe</option>
            <option value="5 Star Luxury">5 Star Luxury</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] font-black uppercase text-slate-400">Meal Plan</label>
          <select id="mealPlan" class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-white font-bold text-xs focus:outline-none focus:border-sky-500">
            <option value="CP (Breakfast Only)">CP (Breakfast Only)</option>
            <option value="MAP (Breakfast + Dinner)" selected>MAP (Breakfast + Dinner)</option>
            <option value="AP (All Meals)">AP (All Meals)</option>
          </select>
        </div>
      </div>

      <!-- DURATION & NIGHT SPLIT VARIANTS -->
      <div class="space-y-4">
        <div class="flex items-center justify-between border-t border-slate-800 pt-4">
          <h3 class="text-xs font-black uppercase text-amber-400 tracking-wider flex items-center gap-2">
            <i class="fa-solid fa-clock"></i> Duration Variants & City Night Splits
          </h3>
          <button onclick="addDurationVariant()" class="px-3 py-1.5 bg-sky-600/20 hover:bg-sky-600 text-sky-300 hover:text-white rounded-lg text-xs font-bold transition flex items-center gap-1">
            <i class="fa-solid fa-plus"></i> Add Duration Variant
          </button>
        </div>

        <div id="durationVariantsContainer" class="space-y-4">
          <!-- Dynamic Duration Cards -->
        </div>
      </div>

    </div>

    <!-- PREVIEW / SAVED GRIDS LIST -->
    <div class="bg-slate-950 p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-xl space-y-4">
      <h3 class="text-xs font-black uppercase text-emerald-400 tracking-wider flex items-center gap-2">
        <i class="fa-solid fa-list-check"></i> Active Multi-Duration Rate Grids
      </h3>
      <div id="activeGridsPreview" class="space-y-4 text-xs">
        <!-- Rendered Active Grids -->
      </div>
    </div>

  </main>

  <script>
    window.onload = function() {
      // Add default 3N/4D, 4N/5D, and 5N/6D variants on load
      addDurationVariant("3N / 4D", "2 Nights Munnar + 1 Night Alleppey (Houseboat)", "Sedan (Dzire/Etios)", 12500, 10500, 8500, 5500, 3500);
      addDurationVariant("4N / 5D", "2 Nights Munnar + 1 Night Thekkady + 1 Night Alleppey", "SUV Upgrade (Ertiga/Innova)", 16500, 14000, 11500, 7500, 4500);
      addDurationVariant("5N / 6D", "2 Nights Munnar + 1 Night Thekkady + 1 Night Kovalam + 1 Night Alleppey", "SUV (Innova Crysta)", 21000, 17500, 14500, 9500, 5500);
      renderPreview();
    };

    function addDurationVariant(duration = '', split = '', vehicle = 'Sedan (Dzire/Etios)', single = '', twin = '', triple = '', cwb = '', cnwb = '') {
      const container = document.getElementById('durationVariantsContainer');
      const cardId = 'variant-' + Date.now() + Math.floor(Math.random() * 1000);

      const div = document.createElement('div');
      div.id = cardId;
      div.className = 'variant-card p-4 bg-slate-900 rounded-2xl border border-slate-800 space-y-3';
      div.innerHTML = `
        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-amber-400"></span>
            <input type="text" placeholder="Duration (e.g. 3N / 4D)" value="${duration}" class="var-duration bg-transparent font-black text-amber-400 text-xs focus:outline-none w-32 border-b border-slate-700">
          </div>
          <button onclick="document.getElementById('${cardId}').remove(); renderPreview();" class="text-rose-400 hover:text-rose-300 text-xs font-bold">
            <i class="fa-solid fa-trash"></i> Remove Variant
          </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="text-[10px] font-bold text-slate-400">City Night Split Itinerary</label>
            <input type="text" placeholder="e.g. 2N Munnar + 1N Thekkady + 1N Alleppey" value="${split}" class="var-split w-full mt-1 px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-xl text-white font-bold text-xs focus:outline-none">
          </div>
          <div>
            <label class="text-[10px] font-bold text-slate-400">Vehicle Type / Upgrade</label>
            <select class="var-vehicle w-full mt-1 px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-xl text-sky-400 font-bold text-xs focus:outline-none">
              <option value="Sedan (Dzire/Etios)" ${vehicle.includes('Sedan') ? 'selected' : ''}>Sedan (Dzire/Etios)</option>
              <option value="SUV (Ertiga)" ${vehicle.includes('Ertiga') ? 'selected' : ''}>SUV (Ertiga)</option>
              <option value="SUV (Innova Crysta)" ${vehicle.includes('Innova') ? 'selected' : ''}>SUV (Innova Crysta)</option>
              <option value="Tempo Traveller (12 Seater)" ${vehicle.includes('Tempo') ? 'selected' : ''}>Tempo Traveller (12 Seater)</option>
            </select>
          </div>
        </div>

        <!-- OCCUPANCY RATES GRID -->
        <div>
          <p class="text-[10px] font-extrabold uppercase text-slate-400 mb-1.5">Net Rates Per Person (INR)</p>
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 text-xs">
            <div>
              <span class="text-[9px] text-slate-400 font-bold block">Single Sharing</span>
              <input type="number" placeholder="₹ Rate" value="${single}" class="var-single w-full px-2 py-1 bg-slate-950 border border-slate-800 rounded-lg text-white font-extrabold">
            </div>
            <div>
              <span class="text-[9px] text-slate-400 font-bold block">Twin / Double</span>
              <input type="number" placeholder="₹ Rate" value="${twin}" class="var-twin w-full px-2 py-1 bg-slate-950 border border-slate-800 rounded-lg text-emerald-400 font-extrabold">
            </div>
            <div>
              <span class="text-[9px] text-slate-400 font-bold block">Triple Sharing</span>
              <input type="number" placeholder="₹ Rate" value="${triple}" class="var-triple w-full px-2 py-1 bg-slate-950 border border-slate-800 rounded-lg text-sky-400 font-extrabold">
            </div>
            <div>
              <span class="text-[9px] text-slate-400 font-bold block">Child Bed (CWB)</span>
              <input type="number" placeholder="₹ Rate" value="${cwb}" class="var-cwb w-full px-2 py-1 bg-slate-950 border border-slate-800 rounded-lg text-amber-300 font-extrabold">
            </div>
            <div>
              <span class="text-[9px] text-slate-400 font-bold block">Child No Bed (CNWB)</span>
              <input type="number" placeholder="₹ Rate" value="${cnwb}" class="var-cnwb w-full px-2 py-1 bg-slate-950 border border-slate-800 rounded-lg text-slate-300 font-extrabold">
            </div>
          </div>
        </div>
      `;

      container.appendChild(div);
    }

    function saveRateGridPackage() {
      const dest = document.getElementById('destName').value;
      const hotel = document.getElementById('hotelCategory').value;
      const meal = document.getElementById('mealPlan').value;

      const variantCards = document.querySelectorAll('.variant-card');
      const variants = [];

      variantCards.forEach(card => {
        variants.push({
          duration: card.querySelector('.var-duration').value,
          split: card.querySelector('.var-split').value,
          vehicle: card.querySelector('.var-vehicle').value,
          single: card.querySelector('.var-single').value,
          twin: card.querySelector('.var-twin').value,
          triple: card.querySelector('.var-triple').value,
          cwb: card.querySelector('.var-cwb').value,
          cnwb: card.querySelector('.var-cnwb').value
        });
      });

      const packageGridData = { dest, hotel, meal, variants };
      localStorage.setItem('ja_b2b_rate_grid', JSON.stringify(packageGridData));
      alert('Package Rate Grid Saved Successfully!');
      renderPreview();
    }

    function renderPreview() {
      const saved = localStorage.getItem('ja_b2b_rate_grid');
      const container = document.getElementById('activeGridsPreview');
      if (!saved) {
        container.innerHTML = '<p class="text-slate-500 italic">No rate grid saved yet.</p>';
        return;
      }

      const data = JSON.parse(saved);
      let html = `
        <div class="p-5 bg-slate-900/90 rounded-2xl border border-sky-500/30 space-y-3">
          <div class="flex items-center justify-between border-b border-slate-800 pb-2">
            <div>
              <h4 class="text-sm font-black text-white">${data.dest} Package Rate Grid</h4>
              <p class="text-[10px] text-slate-400 font-bold">${data.hotel} | ${data.meal}</p>
            </div>
            <span class="px-2.5 py-1 bg-sky-500/20 text-sky-400 text-[10px] font-black rounded-lg">B2B Net Rates</span>
          </div>
          
          <div class="space-y-2">
      `;

      data.variants.forEach(v => {
        html += `
          <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1">
            <div class="flex items-center justify-between text-xs">
              <span class="font-black text-amber-400">${v.duration}</span>
              <span class="font-bold text-sky-400">${v.vehicle}</span>
            </div>
            <p class="text-[11px] font-medium text-slate-300"><i class="fa-solid fa-location-dot text-amber-400 mr-1"></i> ${v.split}</p>
            <div class="flex flex-wrap gap-3 text-[10px] font-bold text-slate-400 pt-1 border-t border-slate-800/60">
              <span>Twin: <strong class="text-emerald-400">₹${v.twin}</strong></span>
              <span>Triple: <strong class="text-sky-400">₹${v.triple}</strong></span>
              <span>Single: <strong class="text-white">₹${v.single}</strong></span>
              <span>CWB: <strong class="text-amber-300">₹${v.cwb}</strong></span>
              <span>CNWB: <strong class="text-slate-300">₹${v.cnwb}</strong></span>
            </div>
          </div>
        `;
      });

      html += `</div></div>`;
      container.innerHTML = html;
    }
  </script>
</body>
</html>
