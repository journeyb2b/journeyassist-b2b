<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Assist — B2B Partner Portal</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }

        header h1 {
            color: var(--primary-dark);
            font-size: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .package-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header h3 {
            font-size: 18px;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .badge {
            display: inline-block;
            background: #e0f2fe;
            color: var(--primary-dark);
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .description {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price-section {
            background: #f1f5f9;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .currency {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .amount {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary-dark);
        }

        .basis {
            font-size: 12px;
            color: var(--text-muted);
        }

        .quote-btn {
            background: #25d366;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: background 0.2s;
        }

        .quote-btn:hover {
            background: #20ba5a;
        }

        .loading, .no-packages {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: var(--text-muted);
            font-size: 16px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Journey Assist Partner Portal</h1>
        <span>Live Rate Grid & Quote Engine</span>
    </header>

    <div class="container">
        <!-- Destination Filtering Tabs -->
        <div class="filter-tabs" id="filter-tabs">
            <button class="tab-btn active" onclick="filterDestination('Maldives')">Maldives</button>
            <button class="tab-btn" onclick="filterDestination('Kerala')">Kerala</button>
            <button class="tab-btn" onclick="filterDestination('Bali')">Bali</button>
            <button class="tab-btn" onclick="filterDestination('Andaman')">Andaman</button>
        </div>

        <!-- Package Grid Container -->
        <div class="packages-grid" id="packages-grid">
            <div class="loading">Loading active packages from your Google Sheet...</div>
        </div>
    </div>

    <script>
        // REPLACE THIS STRING WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
        const APPS_SCRIPT_URL = "YOUR_DEPLOYED_APPS_SCRIPT_WEB_APP_URL";

        let allPackages = [];
        let currentDestination = 'Maldives';

        async function loadPortalPackages() {
            const container = document.getElementById('packages-grid');
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                allPackages = await response.json();
                
                if (allPackages.error || !Array.isArray(allPackages)) {
                    throw new Error(allPackages.error || "Invalid data format received.");
                }

                renderCatalog(currentDestination);
            } catch (err) {
                console.error("Sync error:", err);
                container.innerHTML = `<p class="no-packages" style="color: #dc2626;">Failed to load live rates from your Google Sheet. Please check your Web App deployment URL.</p>`;
            }
        }

        function filterDestination(destination) {
            currentDestination = destination;
            
            // Update active tab styling
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.textContent.trim().toLowerCase() === destination.toLowerCase()) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            renderCatalog(destination);
        }

        function renderCatalog(destinationFilter) {
            const container = document.getElementById('packages-grid');
            container.innerHTML = '';

            const filtered = allPackages.filter(p => 
                p.Destination && 
                p.Destination.toLowerCase().includes(destinationFilter.toLowerCase()) && 
                p.Status && p.Status.toLowerCase() === 'active'
            );

            if (filtered.length === 0) {
                container.innerHTML = `<p class="no-packages">No active packages found for ${destinationFilter}.</p>`;
                return;
            }

            filtered.forEach(pkg => {
                container.innerHTML += `
                    <div class="package-card">
                        <div>
                            <div class="card-header">
                                <h3>${pkg['Package Name'] || 'Holiday Package'}</h3>
                                <span class="badge">${pkg.Duration || '4N / 5D'}</span>
                            </div>
                            <p class="description">${pkg['Short Description'] || ''}</p>
                        </div>
                        <div>
                            <div class="price-section">
                                <span class="currency">${pkg.Currency || 'USD'}</span>
                                <span class="amount">${pkg['Starting From Price'] || 'On Request'}</span>
                                <span class="basis">(${pkg['Rate Basis'] || 'Per Couple'})</span>
                            </div>
                            <button class="quote-btn" onclick='openWhatsAppModal(${JSON.stringify(pkg)})'>
                                Send WhatsApp Quote →
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function openWhatsAppModal(pkg) {
            const quoteText = `*${pkg['Package Name']}* — ${pkg.Destination}\n\n` +
                              `Duration: ${pkg.Duration}\n` +
                              `Starting: ${pkg.Currency} ${pkg['Starting From Price']} (${pkg['Rate Basis']})\n` +
                              `Includes: ${pkg.Inclusions}\n\n` +
                              `Booking Policy: ${pkg['Booking Policy']}\n` +
                              `Terms: ${pkg['Terms & Conditions']}\n\n` +
                              `_Sent via Journey Assist B2B Partner Portal_`;
                              
            const encoded = encodeURIComponent(quoteText);
            window.open(`https://wa.me/?text=${encoded}`, '_blank');
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', loadPortalPackages);
    </script>
</body>
</html>
